name: Publish classroom frontend

# Deliberately manual: pushing code does not publish the student site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/configure-pages@v5
      - name: Build browser-only artifact
        run: npm run build:frontend
        env:
          PUBLIC_BACKEND_URL: https://pericles-api.onrender.com
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4

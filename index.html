<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stapleton Public Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="kiosk-page">
  <header class="site-header">
    <nav class="topnav" aria-label="Primary navigation">
      <a class="brand" href="index.html" aria-label="Stapleton Public Library home">
        <span class="brand-mark" aria-hidden="true">SPL</span>
        <span class="brand-copy">
          <span class="brand-name">Stapleton Public Library</span>
          <span class="brand-tag">Digital services, events, and research support</span>
        </span>
      </a>
      <div class="nav-links">
        <a href="index.html" aria-current="page">Home</a>
        <a href="catalog.html">Card Catalog</a>
        <a href="account.html">My Account</a>
        <a href="events.html">Events</a>
        <a href="programs.html">Programs</a>
        <a href="research-help.html">Research Help</a>
        <a href="community-support.html">Community Support</a>
        <a href="about.html">About</a>
        <a href="instructions.html">Instructions</a>
      </div>
      <div class="kiosk-patron-selector">
        <label for="demoAccount">Patron</label>
        <select id="demoAccount" aria-describedby="demoAccountStatus">
          <option value="">Choose A, B, or C (no sign-in)</option>
        </select>
        <p class="sr-only" id="demoAccountStatus" role="status">Choose a patron to view their account.</p>
      </div>
    </nav>
  </header>

  <main class="kiosk-main">
    <section class="chat-shell" aria-labelledby="chat-title">
      <div class="chat-header">
        <div>
          <h1 id="chat-title">Ask Pericles</h1>
        </div>
        <span class="status-pill">Pericles Pilot</span>
      </div>

      <div class="chat-window" id="chatWindow" aria-live="polite"></div>

      <form class="chat-form" id="chatForm">
        <label class="sr-only" for="userPrompt">Ask Pericles, the Stapleton Public Library assistant, a question</label>
        <textarea id="userPrompt" name="prompt" rows="2" maxlength="4000" placeholder="Ask Stapleton Public Library about collections, events, programs, or research help..."></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

  </main>

  <script src="pericles/citation-renderer.js"></script>
  <script src="frontend-config.js"></script>
  <script src="api-client.js"></script>
  <script src="account.js"></script>
  <script src="app.js"></script>
</body>
</html>
